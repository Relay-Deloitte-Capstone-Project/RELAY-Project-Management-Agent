# Keeps the Render free-tier backend (and, via /health's own DB touch, Neon)
# awake: Render sleeps a service after ~15 min without traffic, and the cold
# start after that takes minutes.
# This pings /health every 10 minutes so the service stays warm.
#
# Notes:
# - Measured cold start is ~70-75s (importing sentence-transformers/torch
#   before Uvicorn can even bind the port), so the ping must tolerate that —
#   a 60s timeout was failing on every single cold hit. --retry handles the
#   case where a ping lands mid-boot and the connection is refused outright.
# - GitHub's scheduled workflows can be delayed a few minutes under load —
#   the frontend wake-up ping (login page) covers that gap.
# - Scheduled workflows only run from the DEFAULT branch (main) — merging
#   this file to main is what activates it.
# - Render free tier allows 750 instance-hours/month; one always-awake
#   service uses ~720. Disable this workflow after the demo if needed.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # manual "warm it up now" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -fsS -m 100 --retry 3 --retry-delay 10 --retry-connrefused \
            https://relay-backend-uafq.onrender.com/health
